
name: Build NAMEWORLD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q NAMEWORLD-Android-Project.zip
          ls -la
          ls -la NAMEWORLD

      - name: Build Android APK
        working-directory: NAMEWORLD
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NAMEWORLD-debug-APK
          path: NAMEWORLD/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
